<body data-auth="guest" data-auth-mode="auto" data-page="inventions">
  <a class="visually-hidden-focusable" href="#main">تخطى إلى المحتوى</a>

  <div data-include="partials/header.html"></div>

  <main id="main" class="site-main">

    <div data-include="partials/page-header.html"
         data-props='{"title":"الاختراعات","parent":"المكونات","parent_url":"components.html"}'>
      <button slot="tools" class="btn-square" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterPanel" aria-controls="filterPanel" aria-label="تصفية">
        <svg class="icon" aria-hidden="true"><use href="#filter"></use></svg>
      </button>
      <div slot="tools" class="dropdown select-nawa" data-select="sort">
        <button class="select-nawa__toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <span data-select-label>متوسط</span>
          <svg class="icon" aria-hidden="true"><use href="#arrow-down"></use></svg>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item" type="button" data-value="latest">الأحدث</button></li>
          <li><button class="dropdown-item" type="button" data-value="high">الأعلى</button></li>
          <li><button class="dropdown-item active" type="button" data-value="avg" aria-selected="true">متوسط</button></li>
          <li><button class="dropdown-item" type="button" data-value="low">الأقل</button></li>
        </ul>
      </div>
    </div>

      <div class="container-nawa">

          </div>
          <div class="col">
            <div data-include="partials/components/invention-card.html"
                 data-props='{"image":"assets/images/invention-ecommerce.png","title":"منصة تجارة الكترونية","description":"منصة تجارة إلكترونية متطورة تعتمد على تقنيات الذكاء الاصطناعي لتحسين تجربة البيع والشراء، وتمكينهم من إطلاق متاجرهم الرقمية بسهولة.","required":"700,000","total":"60","min":"100,000","max":"700,000","raised":"700,000","percent":"60","url":"#"}'></div>

          </div>
          <div class="col">
            <div data-include="partials/components/invention-card.html"

          </div>
        </div>

        <div data-include="partials/components/pagination.html"></div>
      </div>
    </section>

    <div class="offcanvas offcanvas-end filter-panel" tabindex="-1" id="filterPanel" aria-labelledby="filterPanelLabel">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="filterPanelLabel">تصفية الاختراعات</h2>
        <button type="button" class="offcanvas-close" data-bs-dismiss="offcanvas" aria-label="إغلاق">
          <svg class="icon" aria-hidden="true"><use href="#close"></use></svg>
        </button>
      </div>
      <form class="offcanvas-body" action="inventions.html" method="get">
        <fieldset>
          <legend class="filter-group__title">التصنيف</legend>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="category[]" value="tech" id="catTech">
            <label class="form-check-label" for="catTech">تقنية</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="category[]" value="ecommerce" id="catCommerce">
            <label class="form-check-label" for="catCommerce">تجارة إلكترونية</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="category[]" value="games" id="catGames">
            <label class="form-check-label" for="catGames">ألعاب</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="category[]" value="ai" id="catAi">
            <label class="form-check-label" for="catAi">ذكاء اصطناعي</label>
          </div>
        </fieldset>

        <fieldset>
          <legend class="filter-group__title">قيمة الاستثمار (ريال)</legend>
          <div class="row g-2">
            <div class="col-6">
              <input class="form-control" type="number" name="min" min="0" placeholder="من" aria-label="الحد الأدنى">
            </div>
            <div class="col-6">
              <input class="form-control" type="number" name="max" min="0" placeholder="إلى" aria-label="الحد الأقصى">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="filter-group__title">نسبة التمويل</legend>
          <input class="form-range" type="range" name="funded" min="0" max="100" step="10" value="0" aria-label="نسبة التمويل">
        </fieldset>

        <button class="btn-gradient w-100 mt-auto" type="submit">تطبيق</button>
      </form>
    </div>
  </main>

  <div data-include="partials/footer.html"></div>
